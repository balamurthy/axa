<!DOCTYPE html>
<html>
<head>
    <title>Insurance Age Validation</title>
</head>

<body>

    <h2>Insurance Applicant Age Validation</h2>

    <label>Enter Applicant Age:</label>

    <input type="number" id="age" min=18 max=65 onkeydown="return  false;"/>

    <button id="va" onclick="validateAge()">Validate Age</button>

    <p id="message"></p>

    <script>
        function validateAge() {
let msg=document.getElementById("message"); 
	    if (document.getElementById("age").value ==="") {
		msg.style.color="red";
		msg.textContent = "Age cannot be empty";
		return;
	    }
            let age = Number(document.getElementById("age").value);
	    
            if (age >= 18 && age <= 65) {
                msg.style.color="green";
		msg.textContent = document.getElementById("age").value +
                    " is Valid age. Applicant is eligible for insurance.";
		     
            } else {
                msg.style.color="red";
			msg.textContent =document.getElementById("age").value +
                    " is Invalid age. Applicant is not eligible for insurance. Valid range is 18-65";
		
            }
        }
    </script>

</body>
</html>
